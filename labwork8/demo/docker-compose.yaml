version: '3.8'

services:
  h2-db:
    image: oscarfonts/h2
    container_name: h2-database
    ports:
      - "1521:1521"
      - "81:81"
    environment:
      - H2_OPTIONS=-ifNotExists -web -webAllowOthers -tcp -tcpAllowOthers -baseDir /opt/h2-data
    volumes:
      - h2_data:/opt/h2-data
    restart: unless-stopped

volumes:
  h2_data: